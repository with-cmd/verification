<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <p id="status">Загрузка...</p>
    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) {
            document.getElementById('status').textContent = 'Ошибка: WebApp не найден';
        } else {
            tg.ready();
            const data = { initData: tg.initData, user: tg.initDataUnsafe?.user };
            tg.sendData(JSON.stringify(data));
            document.getElementById('status').textContent = 'Данные отправлены';
            setTimeout(() => tg.close(), 500);
        }
    </script>
</body>
</html>
