<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верификация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0e0e10;
            color: #e8e8ea;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .status {
            text-align: center;
        }
        .ok { color: #4caf50; }
        .error { color: #f44336; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="status" id="status">
        <div id="loading">⏳ Подтверждение личности...</div>
        <div id="success" class="hidden">✅ Данные отправлены</div>
        <div id="fail" class="hidden">❌ Ошибка</div>
    </div>

    <script>
    (function() {
        const status = document.getElementById('status');
        const loading = document.getElementById('loading');
        const success = document.getElementById('success');
        const fail = document.getElementById('fail');

        const tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) {
            loading.classList.add('hidden');
            fail.classList.remove('hidden');
            return;
        }

        tg.ready();
        tg.expand();

        const initData = tg.initData;
        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;

        if (!initData || !user) {
            loading.classList.add('hidden');
            fail.classList.remove('hidden');
            return;
        }

        const payload = {
            initData: initData,
            userAgent: navigator.userAgent,
            screen: `${screen.width}x${screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            timeOffset: new Date().getTimezoneOffset(),
            language: navigator.language,
            languages: navigator.languages.join(',')
        };

                try {
    // Индикатор: начали отправку
    document.getElementById('status').textContent = '⏳ Отправка...';
    
    console.log('Отправка данных на сервер...');
    const response = await fetch('https://verifyr-snhu.onrender.com/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    
    // Индикатор: сервер ответил
    document.getElementById('status').textContent = '📦 Ответ: ' + response.status;
    
    console.log('Ответ сервера:', response.status);
    loading.classList.add('hidden');
    success.classList.remove('hidden');
    setTimeout(() => tg.close(), 1000);
} catch (e) {
    // Индикатор: ошибка
    document.getElementById('status').textContent = '❌ Ошибка: ' + e.message;
    console.error('Ошибка при отправке:', e);
    loading.classList.add('hidden');
    fail.classList.remove('hidden');
                }
    })();
</script>
</body>
</html>
